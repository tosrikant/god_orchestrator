spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: orchestrator-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/orchestrator/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

server:
  port: 8082
