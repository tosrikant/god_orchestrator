apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: god-mode-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tosrikant/god_orchestrator.git
    targetRevision: HEAD
    path: k8s/services
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
