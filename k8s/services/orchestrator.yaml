apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
    spec:
      containers:
      - name: orchestrator-service
        image: orchestrator-service:vFinal_7
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: mongodb://mongodb:27017/orchestrator
        - name: SPRING_MONGODB_URI
          value: mongodb://mongodb:27017/orchestrator
        - name: MONGODB_URI
          value: mongodb://mongodb:27017/orchestrator
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
spec:
  selector:
    app: orchestrator-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
