apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: god-mode-orchestrator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:tosrikant/god_orchestrator.git'
    targetRevision: master
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
